<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>damaris</title>
    <!-- Kept tailwind for utility, though your custom CSS does most work -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- GLOBAL SETTINGS --- */
        html { width: 100%; height: 100%; background-color: #000; overflow-x: hidden; }
        body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #fff; overflow: hidden; overflow-x: hidden; font-family: 'Cascade Mono', monospace; font-weight: regular; font-size: 10pt; -webkit-font-smoothing: none; transition: background-color 0.5s ease; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }

        a { color: #fff; text-decoration: none; cursor: pointer; }
        a.active { 
            text-decoration: none; 
            background-color: #fff; 
            color: #000; 
        }

        @media (hover: hover) {
            a:hover { 
                text-decoration: none; 
                background-color: #fff; 
                color: #000; 
            }
        }

        @media (hover: none) {
            a.nav-link:active {
                background-color: #fff;
                color: #000;
            }
        }

        /* --- PUNCTUATION STYLING --- */
        #nav-container .nav-text span {
            font-size: 10pt !important;
            font-weight: bold !important;
            color: #fff !important;
        }

        /* --- NAVIGATION --- */
        #nav-container { position: fixed; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 100; padding: 0 20px; padding-bottom: max(0px, env(safe-area-inset-bottom)); box-sizing: border-box; user-select: none; overflow: hidden; white-space: nowrap; }
        .nav-text { display: inline-block; white-space: nowrap; }
        
        #punc-1 { width: 14ch; display: inline-block; } 
        #punc-2 { width: 13ch; display: inline-block; } 
        #punc-3 { width: 17ch; display: inline-block; } 
        #punc-4 { width: 13ch; display: inline-block; } 
        
        .link-fixed-width { display: inline-block; width: 75px; text-align: center; }
        
        .nav-link { 
            display: inline-block; 
            padding: 0 2px; 
            width: 100%; 
            text-align: center; 
            box-sizing: border-box; 
            transition: background-color 0.3s ease, color 0.3s ease; 
            font-weight: bold;
            color: #fff;
            font-size: 10pt;
        }

        /* --- SECTIONS (PAGES) --- */
        .page-section { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            overflow-x: hidden; 
            overscroll-behavior-x: none; 
            -webkit-overflow-scrolling: touch;
            background-color: #000; 
            padding: 80px 0 100px 0; 
            box-sizing: border-box; 
            z-index: 10; 
            animation: fadeIn 0.4s ease-out forwards; 
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #landing-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        #landing-video.is-playing {
            opacity: 1;
        }
        #landing-video::-webkit-media-controls,
        #landing-video::-webkit-media-controls-enclosure,
        #landing-video::-webkit-media-controls-panel,
        #landing-video::-webkit-media-controls-start-playback-button,
        #landing-video::-webkit-media-controls-overlay-play-button,
        #landing-video::-webkit-media-controls-overlay-enclosure {
            display: none !important;
            -webkit-appearance: none !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none !important;
        }

        #landing {
            padding: 0;
            overflow: hidden;
        }

        #landing .grid-12 {
            position: relative;
            z-index: 1;
        }

        /* --- GRID SYSTEMS --- */
        .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; max-width: none; margin: 0; align-items: start; }
        .project-content-wrapper { padding: 20px 36px 150px 36px; width: 100%; margin: 0; box-sizing: border-box; }
        
        /* --- SLIDESHOW (From Project Pages) --- */
        .slideshow-container { display: flex; overflow-x: auto; gap: 5px; width: 100%; height: 60vh; margin-bottom: 0; padding-left: 0; padding-right: 0; box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: auto; }
        .slideshow-container::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 auto; height: 100%; width: auto; position: relative; }
        .slide img, .slide video { height: 100%; width: auto; object-fit: contain; display: block; }

        /* --- ARCHIVE LAYOUT --- */
        .archive-free-layout {
            position: relative; 
            width: 100%;
            min-height: 5000px; 
            max-width: 100%; 
            margin: 0 auto;
        }

        a.project-item { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: transparent; 
            border: none; 
            cursor: grab;
            text-decoration: none; 
            color: #fff; 
            position: absolute; 
            z-index: 1;
            top: var(--top, auto);
            left: var(--left, auto);
            right: var(--right, auto);
            width: var(--width, auto);
            height: var(--height, auto); 
            justify-content: center; 
            user-select: none;
            -webkit-user-drag: none;
        }
        
        a.project-item.dragging {
            cursor: grabbing;
            z-index: 1000 !important;
            transition: none !important; 
        }
        
        a.project-item:hover { z-index: 50; text-shadow: none; background: transparent; } 

        /* Legacy scroll layout slots (unused once board is open) */
        .archive-slot-1 { --top: 0px; --right: 0px; --width: 30%; z-index: 3; text-align: right; align-items: flex-end; }
        .archive-slot-3 { --top: 700px; --left: 20px; --width: 60%; z-index: 8; }
        .archive-slot-4 { --top: 1000px; --left: -40px; --width: 70%; z-index: 5; text-align: left; align-items: flex-end; }
        .archive-slot-6 { --top: 1700px; --right: 0px; --width: 100%; z-index: 7; text-align: right; align-items: flex-end; }
        .archive-slot-9 { --top: 2300px; --right: 200px; --width: 50%; z-index: 6; }
        .archive-slot-7 { --top: 2350px; --left: 0px; --width: 100%; z-index: 2; }
        .archive-slot-2 { --top: 3100px; --left: 50px; --width: 100%; z-index: 10; }
        .archive-slot-5 { --top: 3600px; --right: 50px; --width: 100%; z-index: 4; }
        .archive-slot-8 { --top: 1000px; --left: 500px; --width: 40%; z-index: 9; }
        .archive-slot-10 { --top: 4000px; --left: 120px; --width: 55%; z-index: 5; }
        .archive-slot-11 { --top: 4200px; --right: 80px; --width: 45%; z-index: 6; }
        .archive-slot-12 { --top: 4500px; --left: 200px; --width: 55%; z-index: 7; }
        .archive-slot-13 { --top: 4800px; --right: 120px; --width: 50%; z-index: 8; }

        .project-img, .project-video { height: auto; display: block; border: none; pointer-events: none; }
        .project-description { line-height: 1.2; grid-column: 1 / 10; }
        .col-span-12 { grid-column: span 12; }

        /* Freeform board (desktop + mobile) */
        html.archive-board-open,
        html.archive-board-open body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        html.archive-board-open #site-content {
            height: 100%;
            overflow: hidden;
        }
        html.archive-board-open #archive.page-section {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            animation: none;
            touch-action: none;
            cursor: grab;
        }
        html.archive-board-open #archive.page-section.is-panning {
            cursor: grabbing;
        }
        html.archive-board-open #landing {
            display: none !important;
            visibility: hidden !important;
        }
        html.archive-board-open #landing-video {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        html.archive-board-open #nav-container {
            position: fixed;
        }
        html.archive-board-open .archive-free-layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 1400px;
            height: 2400px;
            min-height: 2400px;
            padding: 0;
            margin: 0;
            display: block;
            overflow: visible;
            transform-origin: 0 0;
            will-change: transform;
            touch-action: none;
        }
        html.archive-board-open .archive-free-layout a.project-item {
            position: absolute !important;
            display: block;
            margin: 0 !important;
            top: auto;
            left: auto;
            right: auto;
            bottom: auto;
            width: 300px;
            height: auto !important;
            cursor: grab;
            touch-action: none;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-touch-callout: none;
            transition: none;
        }
        html.archive-board-open .archive-free-layout a.project-item.dragging {
            cursor: grabbing;
            z-index: 1000 !important;
        }
        html.archive-board-open .archive-free-layout a.project-item .project-img,
        html.archive-board-open .archive-free-layout a.project-item .project-video {
            width: 100% !important;
            max-width: none;
            height: auto;
            display: block;
            margin: 0 !important;
            pointer-events: none;
        }
        .project-video::-webkit-media-controls,
        .project-video::-webkit-media-controls-enclosure,
        .project-video::-webkit-media-controls-panel,
        .project-video::-webkit-media-controls-start-playback-button,
        .project-video::-webkit-media-controls-overlay-play-button {
            display: none !important;
            -webkit-appearance: none;
        }

        @media (min-width: 1025px) {
            html.archive-board-open .archive-free-layout {
                width: 3600px;
                height: 2400px;
                min-height: 2400px;
            }

                width: 420px;

        @media (max-width: 1024px) {
            .grid-12 { grid-template-columns: repeat(4, 1fr); }
            .col-span-12 { grid-column: span 4 !important; }
            .project-description { grid-column: 1 / -1 !important; }
            .slideshow-container { height: 50vh; }

            #landing { padding: 0; overflow: hidden; }

            #archive.page-section {

            #punc-1, #punc-4 { display: none !important; }
            #punc-2, #punc-3 {

                max-width: 3ch;

            }
            .link-fixed-width { width: auto; min-width: 52px; flex-shrink: 0; }
            .nav-link { font-size: 10pt; padding: 4px 2px; }
        }

        #site-content { width: 100%; height: 100%; }

        .project-img,
        .project-video {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (hover: hover) {
            .project-item:hover .project-img,
            .project-item:hover .project-video {
                transform: scale(1.04);
            }
        }
        
        .project-item.dragging .project-img,
        .project-item.dragging .project-video {
            transform: scale(1.04); 
        }

        /* Keep freeform dragging smooth (no hover scale fighting the drag) */
        html.archive-board-open .project-img,
        html.archive-board-open .project-video {
            transition: none !important;
        }
        html.archive-board-open .project-item:hover .project-img,
        html.archive-board-open .project-item:hover .project-video,
        html.archive-board-open .project-item.dragging .project-img,
        html.archive-board-open .project-item.dragging .project-video {
            transform: none;
        }
        html.archive-board-open .archive-free-layout a.project-item.dragging {
            will-change: transform;
        }

        #archive-hint {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            pointer-events: none;
            font-family: 'Cascade Mono', monospace;
            font-weight: bold;
            font-size: 10pt;
            color: #fff;
            text-align: center;
            padding: 0 24px;
            width: max-content;
            max-width: 90vw;
            line-height: 1.45;
            height: calc(1.45em * 2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease, visibility 0.45s ease;
            text-shadow:
                0 1px 2px rgba(0,0,0,0.45),
                0 0 6px rgba(0,0,0,0.25);
            white-space: pre;
        }
        #archive-hint.is-visible {
            opacity: 1;
            visibility: visible;
        }
        @media (max-width: 1024px) {
            #archive-hint {
                font-size: 11pt;
                line-height: 1.45;
                height: calc(1.45em * 2);
            }
        }

        /* Desktop archive intro: soft blur from the edges */
        #archive-intro-veil {
            position: fixed;
            inset: 0;
            z-index: 160;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            --intro-blur: 28px;
            --intro-clear: 12%;
            backdrop-filter: blur(var(--intro-blur));
            -webkit-backdrop-filter: blur(var(--intro-blur));
            background: radial-gradient(
                ellipse 75% 70% at 50% 48%,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.12) 42%,
                rgba(0, 0, 0, 0.55) 100%
            );
            -webkit-mask-image: radial-gradient(
                ellipse 80% 75% at 50% 48%,
                transparent var(--intro-clear),
                #000 calc(var(--intro-clear) + 42%),
                #000 100%
            );
            mask-image: radial-gradient(
                ellipse 80% 75% at 50% 48%,
                transparent var(--intro-clear),
                #000 calc(var(--intro-clear) + 42%),
                #000 100%
            );
        }
        #archive-intro-veil.is-active {
            opacity: 1;
            visibility: visible;
        }
        @media (max-width: 1024px) {
            #archive-intro-veil { display: none !important; }
        }
    </style>
</head>

<script>
    const IS_DESKTOP = window.innerWidth >= 1025;
    const IS_MOBILE = !IS_DESKTOP;

    // Mobile-only background video (desktop keeps startvideo.mp4)
    (function applyBackgroundVideo() {
        const video = document.getElementById('landing-video');
        if (!video) return;
        const source = video.querySelector('source');
        if (!source) return;

        video.muted = true;
        video.defaultMuted = true;
        video.volume = 0;
        video.loop = true;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        video.setAttribute('muted', 'muted');
        video.setAttribute('autoplay', '');
        video.setAttribute('loop', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.removeAttribute('controls');
        video.disablePictureInPicture = true;
        video.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');

        if (IS_MOBILE) {
            source.src = 'video/startvideo-mobile.mp4';
        }

        window.__landingVideo = video;

        function isLandingVisible() {
            const landing = document.getElementById('landing');
            return landing && landing.style.display !== 'none' &&
                !document.documentElement.classList.contains('archive-board-open');
        }

        function markPlaying() {
            if (!video.paused) video.classList.add('is-playing');
        }

        function keepPlaying() {
            if (!isLandingVisible()) {
                video.pause();
                video.classList.remove('is-playing');
                return;
            }
            video.muted = true;
            video.volume = 0;
            video.controls = false;
            const p = video.play();
            if (p && typeof p.then === 'function') {
                p.then(markPlaying).catch(() => {
                    video.classList.remove('is-playing');
                });
            } else {
                markPlaying();
            }
        }

        window.__syncLandingVideo = function(sectionId) {
            if (sectionId === 'landing') {
                video.style.display = '';
                video.style.visibility = '';
                keepPlaying();
            } else {
                video.pause();
                video.controls = false;
                video.classList.remove('is-playing');
                video.style.display = 'none';
                video.style.visibility = 'hidden';
            }
        };

        video.addEventListener('playing', markPlaying);
        video.addEventListener('pause', () => {
            if (!isLandingVisible()) video.classList.remove('is-playing');
        });

        video.load();
        keepPlaying();
        video.addEventListener('loadeddata', keepPlaying, { once: true });
        video.addEventListener('canplay', keepPlaying, { once: true });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) keepPlaying();
            else video.pause();
        });
        // First tap/scroll anywhere can unlock autoplay on strict mobile browsers
        const unlock = () => keepPlaying();
        document.addEventListener('touchstart', unlock, { passive: true, once: true });
        document.addEventListener('click', unlock, { once: true });

        let tries = 0;
        const retry = setInterval(() => {
            tries += 1;
            if (!isLandingVisible() || (!video.paused && video.classList.contains('is-playing')) || tries > 30) {
                clearInterval(retry);
                return;
            }
            keepPlaying();
        }, 200);
    })();

    // Use lower-res covers on mobile
    if (IS_MOBILE) {
        document.querySelectorAll('#archive-content-wrapper img.project-img').forEach(img => {
            const src = img.getAttribute('src') || '';
            if (src.startsWith('bilder/')) {
                img.setAttribute('src', src.replace(/^bilder\//, 'bilder-mobile/'));
            }
        });
        document.querySelectorAll('#archive-content-wrapper video.project-video').forEach(video => {
            const src = video.getAttribute('src') || '';
            if (src.startsWith('bilder/')) {
                video.setAttribute('src', src.replace(/^bilder\//, 'bilder-mobile/'));
            }
        });
    }

    // Keep archive cover videos looping (muted / playsinline for autoplay)
    (function initArchiveCoverVideos() {
        const videos = document.querySelectorAll('#archive-content-wrapper video.project-video');
        if (!videos.length) return;

        function playCover(video) {
            video.muted = true;
            video.defaultMuted = true;
            video.volume = 0;
            video.loop = true;
            video.playsInline = true;
            video.controls = false;
            video.setAttribute('muted', 'muted');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.setAttribute('loop', '');
            video.removeAttribute('controls');
            video.disablePictureInPicture = true;
            const p = video.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
        }

        videos.forEach(function(video) {
            playCover(video);
            video.addEventListener('loadeddata', function() { playCover(video); }, { once: true });
            video.addEventListener('canplay', function() { playCover(video); });
            video.addEventListener('ended', function() {
                video.currentTime = 0;
                playCover(video);
            });
        });

        function unlockArchiveVideos() {
            videos.forEach(playCover);
        }
        document.addEventListener('touchstart', unlockArchiveVideos, { passive: true, once: true });
        document.addEventListener('click', unlockArchiveVideos, { once: true });
    })();
    
    // --- PUNCTUATION ANIMATION ---
    // Mobile uses short separators so the nav never overlaps.
    const PUNCTUATION_FINAL = IS_MOBILE
        ? {
            'punc-1': '',
            'punc-2': ' / ',
            'punc-3': ' / ',
            'punc-4': ''
        }
        : {
            'punc-1': '//////////// , ',
            'punc-2': ' / /. . . , / ',
            'punc-3': ' ,,. /////.,:;:* ',
            'punc-4': '. ../-.-_.-.--'
        };
    const PUNCTUATION_POOL = ['/', ',', '.', ':', ';', '*', '-', '_', '|', '+', '(', ')', '[', ']', '<', '>', ' '];
    const activeIntervals = {};
    let isLoadAnimating = true;
    let punctuationScrambleInterval = null;
    let punctuationLoadFinishTimer = null;
    let archiveHintActive = false;

    function generateRandomPunctuation(length) {
        let result = '';
        for (let i = 0; i < length; i++) {
            result += PUNCTUATION_POOL[Math.floor(Math.random() * PUNCTUATION_POOL.length)];
        }
        return result;
    }

    function animateSpecificPunctuation(puncId) {
        const element = document.getElementById(puncId);
        if (element) {
            const len = PUNCTUATION_FINAL[puncId].length || 3;
            element.textContent = generateRandomPunctuation(len);
        }
    }

    function getVisiblePunctuationIds() {
        return IS_MOBILE
            ? ['punc-2', 'punc-3']
            : Object.keys(PUNCTUATION_FINAL);
    }

    function settlePunctuation() {
        if (punctuationScrambleInterval) {
            clearInterval(punctuationScrambleInterval);
            punctuationScrambleInterval = null;
        }
        if (punctuationLoadFinishTimer) {
            clearTimeout(punctuationLoadFinishTimer);
            punctuationLoadFinishTimer = null;
        }
        isLoadAnimating = false;
        for (const id in PUNCTUATION_FINAL) {
            const el = document.getElementById(id);
            if (el) el.textContent = PUNCTUATION_FINAL[id];
        }
    }

    function scramblePunctuation() {
        if (punctuationScrambleInterval) {
            clearInterval(punctuationScrambleInterval);
        }
        isLoadAnimating = true;
        const visibleIds = getVisiblePunctuationIds();
        for (const id in PUNCTUATION_FINAL) {
            const el = document.getElementById(id);
            if (el && PUNCTUATION_FINAL[id] === '') el.textContent = '';
        }
        punctuationScrambleInterval = setInterval(() => {
            visibleIds.forEach(id => animateSpecificPunctuation(id));
        }, 50);
    }

    function startPunctuationAnimation() {
        const minDuration = 3000;
        const startedAt = Date.now();
        scramblePunctuation();

        function finishAnimation() {
            const remaining = Math.max(0, minDuration - (Date.now() - startedAt));
            if (punctuationLoadFinishTimer) clearTimeout(punctuationLoadFinishTimer);
            punctuationLoadFinishTimer = setTimeout(() => {
                punctuationLoadFinishTimer = null;
                // Archive hint owns the end time while it is visible
                if (archiveHintActive) return;
                settlePunctuation();
            }, remaining);
        }

        if (document.readyState === 'complete') {
            finishAnimation();
        } else {
            window.addEventListener('load', finishAnimation, { once: true });
        }
    }

    function startHoverAnimation(puncId1, puncId2) {
        if (isLoadAnimating || IS_MOBILE) return; 
        if (!activeIntervals[puncId1]) {
            animateSpecificPunctuation(puncId1);
            activeIntervals[puncId1] = setInterval(() => animateSpecificPunctuation(puncId1), 50);
        }
        if (!activeIntervals[puncId2]) {
            animateSpecificPunctuation(puncId2);
            activeIntervals[puncId2] = setInterval(() => animateSpecificPunctuation(puncId2), 50);
        }
    }

    function stopHoverAnimation(puncId1, puncId2) {
        if (activeIntervals[puncId1]) {
            clearInterval(activeIntervals[puncId1]);
            delete activeIntervals[puncId1];
            const el1 = document.getElementById(puncId1);
            if (el1) el1.textContent = PUNCTUATION_FINAL[puncId1];
        }
        if (activeIntervals[puncId2]) {
            clearInterval(activeIntervals[puncId2]);
            delete activeIntervals[puncId2];
            const el2 = document.getElementById(puncId2);
            if (el2) el2.textContent = PUNCTUATION_FINAL[puncId2];
        }
    }

    // --- DRAGGABLE FUNCTIONALITY ---
    // Freeform archive board: pan, zoom, drag covers (desktop + mobile)
    function initArchiveBoard() {
        const archive = document.getElementById('archive');
        const board = document.getElementById('archive-content-wrapper');
        if (!archive || !board) return;

        const items = [...board.querySelectorAll('a.project-item')];
        const MIN_SCALE = 0.35;
        const MAX_SCALE = 2.8;
        const TAP_LIMIT = 10;
        const STORAGE_KEY = IS_MOBILE ? 'mobileArchiveBoard' : 'desktopArchiveBoard';

        let scale = IS_MOBILE ? 0.72 : 0.92;
        let tx = IS_MOBILE ? 20 : 48;
        let ty = IS_MOBILE ? 40 : 56;
        let mode = null; // 'pan' | 'drag' | 'pinch'
        let activeItem = null;
        let startX = 0, startY = 0;
        let startTx = 0, startTy = 0;
        let startLeft = 0, startTop = 0;
        let dragDx = 0, dragDy = 0;
        let moved = false;
        let pinchStartDist = 0;
        let pinchStartScale = 1;
        let pinchStartTx = 0, pinchStartTy = 0;
        let pinchMidX = 0, pinchMidY = 0;
        let rafId = 0;
        let pendingPan = false;
        let pendingDrag = false;
        let introRaf = 0;
        let introActive = false;
        let introEnd = null; // { scale, tx, ty }
        let introVeilFade = null;

        function boardIsOpen() {
            return document.documentElement.classList.contains('archive-board-open');
        }

        function applyBoardTransform() {
            board.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
        }

        function clearIntroVeil() {
            const veil = document.getElementById('archive-intro-veil');
            if (!veil) return;
            veil.classList.remove('is-active');
            veil.style.opacity = '';
            veil.style.setProperty('--intro-blur', '28px');
            veil.style.setProperty('--intro-clear', '12%');
        }

        function cancelIntroZoom() {
            if (introRaf) {
                cancelAnimationFrame(introRaf);
                introRaf = 0;
            }
            if (introVeilFade) {
                cancelAnimationFrame(introVeilFade);
                introVeilFade = null;
            }
            introActive = false;
            introEnd = null;
            clearIntroVeil();
        }

        function fadeOutIntroVeil(ms) {
            const veil = document.getElementById('archive-intro-veil');
            if (!veil) return;
            const start = performance.now();
            const startOpacity = parseFloat(veil.style.opacity || '1') || 1;
            function step(now) {
                const t = Math.min(1, (now - start) / ms);
                const o = startOpacity * (1 - t);
                veil.style.opacity = String(o);
                if (t < 1) {
                    introVeilFade = requestAnimationFrame(step);
                } else {
                    introVeilFade = null;
                    clearIntroVeil();
                }
            }
            introVeilFade = requestAnimationFrame(step);
        }

        function settleDesktopIntroZoom() {
            if (IS_MOBILE) return;
            if (!introActive) return;
            // Stop zoom exactly where it is when typing finishes
            if (introRaf) {
                cancelAnimationFrame(introRaf);
                introRaf = 0;
            }
            introActive = false;
            introEnd = null;
            fadeOutIntroVeil(500);
            saveBoardState();
        }

        function playDesktopIntroZoom() {
            if (IS_MOBILE) return;
            cancelIntroZoom();

            const veil = document.getElementById('archive-intro-veil');
            // Freeform board: settle zoomed-out on the cluster center —
            // covers continue past the edges; dig further by zooming/panning.
            const endScale = Math.min(1.02, Math.max(0.82, window.innerWidth / 1550)) / 1.4 / 1.4;
            const startScale = endScale * 3.6;
            const focus = getCompositionFocus();
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const endTx = cx - focus.x * endScale;
            const endTy = cy - focus.y * endScale;

            scale = startScale;
            tx = cx - focus.x * scale;
            ty = cy - focus.y * scale;
            applyBoardTransform();

            introEnd = { scale: endScale, tx: endTx, ty: endTy };
            introActive = true;

            if (veil) {
                veil.style.setProperty('--intro-blur', '34px');
                veil.style.setProperty('--intro-clear', '8%');
                veil.style.opacity = '1';
                veil.classList.add('is-active');
            }

            let lastTime = performance.now();

            function frame(now) {
                if (!introActive || !boardIsOpen()) {
                    cancelIntroZoom();
                    return;
                }

                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;
                // Continuous natural drift toward resting frame until typing stops it
                const k = 1 - Math.exp(-dt * 2.1);
                scale += (introEnd.scale - scale) * k;
                tx += (introEnd.tx - tx) * k;
                ty += (introEnd.ty - ty) * k;
                applyBoardTransform();

                if (veil) {
                    const span = startScale - endScale || 1;
                    const progress = Math.max(0, Math.min(1, (startScale - scale) / span));
                    const blur = 34 * (1 - progress);
                    const clear = 8 + progress * 80;
                    veil.style.setProperty('--intro-blur', blur.toFixed(1) + 'px');
                    veil.style.setProperty('--intro-clear', clear.toFixed(1) + '%');
                    veil.style.opacity = String(Math.max(0.2, 1 - progress * 0.75));
                }

                introRaf = requestAnimationFrame(frame);
            }

            introRaf = requestAnimationFrame(frame);
        }

        function flushPointerFrame() {
            rafId = 0;
            if (pendingPan) {
                pendingPan = false;
                applyBoardTransform();
            }
            if (pendingDrag && activeItem && mode === 'drag') {
                pendingDrag = false;
                activeItem.style.transform = `translate(${dragDx}px, ${dragDy}px)`;
            }
        }

        function schedulePointerFrame() {
            if (rafId) return;
            rafId = requestAnimationFrame(flushPointerFrame);
        }

        function saveBoardState() {
            const state = {
                scale, tx, ty,
                items: items.map(item => ({
                    left: item.style.left || '',
                    top: item.style.top || '',
                    width: item.style.width || '',
                    z: item.style.zIndex || ''
                }))
            };
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getCompositionFocus() {
            const b = getItemsBounds();
            if (!b) return { x: 560, y: 520 };
            return { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 };
        }

        function getItemsBounds() {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            let n = 0;
            items.forEach(item => {
                const l = parseFloat(item.style.left);
                const t = parseFloat(item.style.top);
                const w = parseFloat(item.style.width) || 300;
                if (!Number.isFinite(l) || !Number.isFinite(t)) return;
                const h = Math.max(item.offsetHeight || 0, w * mediaAspect(item));
                minX = Math.min(minX, l);
                minY = Math.min(minY, t);
                maxX = Math.max(maxX, l + w);
                maxY = Math.max(maxY, t + h);
                n += 1;
            });
            if (!n) return null;
            return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
        }

        function fitCompositionToView(padding) {
            const pad = padding == null ? 0.1 : padding;
            const b = getItemsBounds();
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            if (!b || b.w < 40 || b.h < 40) {
                const s = Math.min(1.02, Math.max(0.82, vw / 1550)) / 1.4 / 1.4;
                return { scale: s, tx: 48, ty: 56 };
            }
            const availW = Math.max(200, vw * (1 - pad * 2));
            const availH = Math.max(200, vh * (1 - pad * 2));
            let s = Math.min(availW / b.w, availH / b.h);
            s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
            const cx = (b.minX + b.maxX) / 2;
            const cy = (b.minY + b.maxY) / 2;
            return {
                scale: s,
                tx: vw / 2 - cx * s,
                ty: vh / 2 - cy * s
            };
        }

        function overlapRatio(a, b) {
            const x1 = Math.max(a.left, b.left);
            const y1 = Math.max(a.top, b.top);
            const x2 = Math.min(a.left + a.w, b.left + b.w);
            const y2 = Math.min(a.top + a.h, b.top + b.h);
            const iw = x2 - x1;
            const ih = y2 - y1;
            if (iw <= 0 || ih <= 0) return 0;
            const inter = iw * ih;
            return inter / Math.min(a.w * a.h, b.w * b.h);
        }

        function mediaAspect(item) {
            const media = item.querySelector('img.project-img, video.project-video');
            let aspect = 1.15;
            if (!media) return aspect;
            if (media.tagName === 'IMG' && media.naturalWidth > 0 && media.naturalHeight > 0) {
                return media.naturalHeight / media.naturalWidth;
            }
            if (media.tagName === 'VIDEO' && media.videoWidth > 0 && media.videoHeight > 0) {
                return media.videoHeight / media.videoWidth;
            }
            const attrW = parseFloat(media.getAttribute('width'));
            const attrH = parseFloat(media.getAttribute('height'));
            if (attrW > 0 && attrH > 0) return attrH / attrW;
            return aspect;
        }

        function randomizeComposition() {
            // Freeform board: loose scatter, light overlaps, room to dig through
            const boardW = IS_MOBILE ? 1400 : 2800;
            const boardH = IS_MOBILE ? 2000 : 2000;
            const widths = IS_MOBILE
                ? [200, 230, 260, 280, 300, 320, 340, 360]
                : [300, 340, 380, 420, 460, 500, 540];
            const maxOverlap = 0.32;
            const placed = [];

            sessionStorage.removeItem(STORAGE_KEY);

            // Bias toward a central field so the first view feels inhabited,
            // but allow outliers past the edges for zooming out / panning.
            const coreW = IS_MOBILE ? boardW * 0.72 : boardW * 0.62;
            const coreH = IS_MOBILE ? boardH * 0.62 : boardH * 0.62;
            const coreX = (boardW - coreW) / 2;
            const coreY = (boardH - coreH) / 2;

            items.forEach((item) => {
                let w = widths[Math.floor(Math.random() * widths.length)];
                if ((item.getAttribute('href') || '').indexOf('london.html') !== -1) {
                    w = Math.round(w * 1.5);
                }

                const aspect = mediaAspect(item);
                const estH = w * aspect;
                let chosen = null;

                for (let attempt = 0; attempt < 70; attempt++) {
                    // ~70% in the core, ~30% further out (off first viewport)
                    const inCore = Math.random() < 0.7;
                    const left = inCore
                        ? coreX + Math.random() * Math.max(40, coreW - w)
                        : 30 + Math.random() * Math.max(40, boardW - w - 60);
                    const top = inCore
                        ? coreY + Math.random() * Math.max(40, coreH - estH)
                        : 30 + Math.random() * Math.max(40, boardH - estH - 60);

                    const next = { left, top, w, h: estH };
                    const heaviest = placed.reduce((max, p) => Math.max(max, overlapRatio(p, next)), 0);
                    if (heaviest <= maxOverlap) {
                        chosen = next;
                        // Prefer a light kiss sometimes for a lived-in pile
                        if (placed.length >= 2 && heaviest > 0.04) break;
                        if (placed.length < 2 || attempt > 25 || Math.random() < 0.35) break;
                    }
                }

                if (!chosen) {
                    chosen = {
                        left: coreX + Math.random() * Math.max(40, coreW - w),
                        top: coreY + Math.random() * Math.max(40, coreH - estH),
                        w,
                        h: estH
                    };
                }

                placed.push(chosen);
                item.style.setProperty('width', chosen.w + 'px', 'important');
                item.style.left = Math.round(chosen.left) + 'px';
                item.style.top = Math.round(chosen.top) + 'px';
                item.style.right = 'auto';
                item.style.bottom = 'auto';
                item.style.zIndex = String(1 + Math.floor(Math.random() * 10));
            });
        }

        function dist(a, b) {
            return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        }

        function mid(a, b) {
            return {
                x: (a.clientX + b.clientX) / 2,
                y: (a.clientY + b.clientY) / 2
            };
        }

        function bringToFront(item) {
            let maxZ = 10;
            items.forEach(el => {
                const z = parseInt(getComputedStyle(el).zIndex, 10) || 1;
                if (z > maxZ) maxZ = z;
            });
            item.style.zIndex = String(maxZ + 1);
        }

        function beginPointer(clientX, clientY, target) {
            cancelIntroZoom();
            hideArchiveHint();
            startX = clientX;
            startY = clientY;
            moved = false;
            dragDx = 0;
            dragDy = 0;

            const targetItem = target && target.closest && target.closest('a.project-item');
            if (targetItem && board.contains(targetItem)) {
                mode = 'drag';
                activeItem = targetItem;
                bringToFront(activeItem);
                activeItem.classList.add('dragging');
                startLeft = parseFloat(activeItem.style.left) || activeItem.offsetLeft;
                startTop = parseFloat(activeItem.style.top) || activeItem.offsetTop;
                activeItem.style.willChange = 'transform';
                activeItem.style.transform = 'translate(0px, 0px)';
            } else {
                mode = 'pan';
                activeItem = null;
                startTx = tx;
                startTy = ty;
                archive.classList.add('is-panning');
            }
        }

        function movePointer(clientX, clientY, preventDefault) {
            if (!mode) return;
            const dx = clientX - startX;
            const dy = clientY - startY;
            if (Math.hypot(dx, dy) > TAP_LIMIT) moved = true;

            if (mode === 'pan') {
                if (preventDefault) preventDefault();
                tx = startTx + dx;
                ty = startTy + dy;
                pendingPan = true;
                schedulePointerFrame();
            } else if (mode === 'drag' && activeItem) {
                if (preventDefault) preventDefault();
                dragDx = dx / scale;
                dragDy = dy / scale;
                pendingDrag = true;
                schedulePointerFrame();
            }
        }

        function endPointer(openOnTap) {
            archive.classList.remove('is-panning');
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = 0;
            }
            if (pendingPan) {
                pendingPan = false;
                applyBoardTransform();
            }
            if (mode === 'drag' && activeItem) {
                if (pendingDrag || dragDx || dragDy) {
                    pendingDrag = false;
                    activeItem.style.left = (startLeft + dragDx) + 'px';
                    activeItem.style.top = (startTop + dragDy) + 'px';
                    activeItem.style.right = 'auto';
                    activeItem.style.bottom = 'auto';
                }
                activeItem.style.transform = '';
                activeItem.style.willChange = '';
            }
            if (openOnTap && mode === 'drag' && activeItem && !moved) {
                const href = activeItem.getAttribute('href');
                saveBoardState();
                if (href) window.location.href = href;
            } else if (moved) {
                saveBoardState();
            }
            if (activeItem) activeItem.classList.remove('dragging');
            mode = null;
            activeItem = null;
            dragDx = 0;
            dragDy = 0;
        }

        function zoomAt(clientX, clientY, factor) {
            const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
            if (nextScale === scale) return;
            const worldX = (clientX - tx) / scale;
            const worldY = (clientY - ty) / scale;
            scale = nextScale;
            tx = clientX - worldX * scale;
            ty = clientY - worldY * scale;
            applyBoardTransform();
            saveBoardState();
        }

        randomizeComposition();
        applyBoardTransform();
        saveBoardState();

        // --- Touch ---
        archive.addEventListener('touchstart', (e) => {
            if (!boardIsOpen()) return;
            hideArchiveHint();

            if (e.touches.length === 2) {
                mode = 'pinch';
                activeItem = null;
                archive.classList.remove('is-panning');
                const a = e.touches[0], b = e.touches[1];
                pinchStartDist = dist(a, b) || 1;
                pinchStartScale = scale;
                pinchStartTx = tx;
                pinchStartTy = ty;
                const m = mid(a, b);
                pinchMidX = m.x;
                pinchMidY = m.y;
                moved = true;
                return;
            }

            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            beginPointer(t.clientX, t.clientY, t.target);
        }, { passive: true });

        archive.addEventListener('touchmove', (e) => {
            if (!boardIsOpen()) return;
            if (!mode) return;

            if (mode === 'pinch' && e.touches.length === 2) {
                e.preventDefault();
                const a = e.touches[0], b = e.touches[1];
                const d = dist(a, b) || 1;
                const m = mid(a, b);
                const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * (d / pinchStartDist)));
                const worldX = (pinchMidX - pinchStartTx) / pinchStartScale;
                const worldY = (pinchMidY - pinchStartTy) / pinchStartScale;
                scale = nextScale;
                tx = m.x - worldX * scale;
                ty = m.y - worldY * scale;
                applyBoardTransform();
                moved = true;
                return;
            }

            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            movePointer(t.clientX, t.clientY, () => e.preventDefault());
        }, { passive: false });

        archive.addEventListener('touchend', (e) => {
            if (!boardIsOpen()) return;

            if (mode === 'pinch') {
                if (e.touches.length >= 2) return;
                if (e.touches.length === 1) {
                    mode = 'pan';
                    const t = e.touches[0];
                    startX = t.clientX;
                    startY = t.clientY;
                    startTx = tx;
                    startTy = ty;
                    activeItem = null;
                    archive.classList.add('is-panning');
                    return;
                }
                saveBoardState();
                mode = null;
                archive.classList.remove('is-panning');
                return;
            }

            endPointer(true);
        }, { passive: true });

        archive.addEventListener('touchcancel', () => endPointer(false), { passive: true });

        // --- Mouse (desktop) ---
        archive.addEventListener('mousedown', (e) => {
            if (!boardIsOpen()) return;
            if (e.button !== 0) return;
            if (e.target.closest && e.target.closest('#nav-container')) return;
            e.preventDefault();
            beginPointer(e.clientX, e.clientY, e.target);

            function onMove(ev) {
                movePointer(ev.clientX, ev.clientY, null);
            }
            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                endPointer(true);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        archive.addEventListener('wheel', (e) => {
            if (!boardIsOpen()) return;
            // Desktop: ignore scroll/wheel zoom. Only react to trackpad pinch
            // (browsers expose pinch as wheel + ctrlKey).
            if (!e.ctrlKey) return;
            e.preventDefault();
            cancelIntroZoom();
            hideArchiveHint();
            const factor = Math.exp(-e.deltaY * 0.01);
            zoomAt(e.clientX, e.clientY, factor);
        }, { passive: false });

        // Block default click navigation; open via tap/click when not dragged
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
            item.addEventListener('dragstart', (e) => e.preventDefault());
        });

        window.__resetArchiveBoardView = function() {
            if (IS_MOBILE) {
                const focus = getCompositionFocus();
                scale = Math.min(0.9, Math.max(0.55, window.innerWidth / 980));
                tx = window.innerWidth / 2 - focus.x * scale;
                ty = window.innerHeight * 0.42 - focus.y * scale;
                applyBoardTransform();
                saveBoardState();
            } else {
                playDesktopIntroZoom();
            }
        };

        window.__settleArchiveIntro = settleDesktopIntroZoom;

        window.__randomizeArchiveComposition = function() {
            randomizeComposition();
            if (typeof window.__resetArchiveBoardView === 'function') {
                window.__resetArchiveBoardView();
            } else {
                applyBoardTransform();
            }
            saveBoardState();
        };
    }

    // --- SCROLL PRESERVATION LOGIC ---
    let savedArchiveScroll = 0;

    function saveArchiveScroll() {
        // Freeform board state is saved by initArchiveBoard
    }

    function restoreArchiveScroll() {
        if (typeof window.__resetArchiveBoardView === 'function') {
            window.__resetArchiveBoardView();
        }
    }

    // --- NAVIGATION LOGIC ---
    function handleNavClick(e, sectionId) {
        if (e) e.preventDefault();
        history.pushState(null, null, '#' + sectionId);
        showSection(sectionId);
    }

    // FIX: PROFILE SINGLE CLICK
    function handleProfileNavigation(e) {
        e.preventDefault();
        saveArchiveScroll();
        window.location.href = "profile.html";
    }

    function setMobileSectionMode(sectionId) {
        const root = document.documentElement;
        const openingArchive = sectionId === 'archive';
        root.classList.toggle('archive-board-open', openingArchive);
        if (!openingArchive) {
            window.scrollTo(0, 0);
        }
        if (typeof window.__syncLandingVideo === 'function') {
            window.__syncLandingVideo(sectionId);
        }
    }

    const TYPE_PUNC = [
        '/', ',', '.', ':', ';', '*', '-', '_', '|', '+',
        '(', ')', '[', ']', '<', '>', '{', '}',
        '!', '?', '#', '%', '&', '=', '~', '^', '`', '"', "'", '\\', '@', '$'
    ];
    let archiveHintTypeToken = 0;

    function sleepMs(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeLikeHuman(el, finalText, tokenRef) {
        const my = tokenRef.token;
        el.textContent = '';
        for (let i = 0; i < finalText.length; i++) {
            if (tokenRef.token !== my) return;
            const ch = finalText[i];
            const canTypo = ch !== '\n' && ch !== ' ' && i > 0 && Math.random() < 0.38;
            if (canTypo) {
                const junkLen = 1 + Math.floor(Math.random() * 4);
                let junk = '';
                for (let j = 0; j < junkLen; j++) {
                    junk += TYPE_PUNC[Math.floor(Math.random() * TYPE_PUNC.length)];
                }
                for (let j = 0; j < junk.length; j++) {
                    if (tokenRef.token !== my) return;
                    el.textContent += junk[j];
                    await sleepMs(35 + Math.random() * 45);
                }
                await sleepMs(90 + Math.random() * 140);
                for (let j = 0; j < junk.length; j++) {
                    if (tokenRef.token !== my) return;
                    el.textContent = el.textContent.slice(0, -1);
                    await sleepMs(30 + Math.random() * 35);
                }
            }
            if (tokenRef.token !== my) return;
            el.textContent += ch;
            await sleepMs(ch === '\n' ? 220 : (40 + Math.random() * 55));
        }
    }

    function showArchiveHint() {
        const hint = document.getElementById('archive-hint');
        if (!hint) return;
        clearTimeout(showArchiveHint._timer);
        archiveHintTypeToken += 1;
        const tokenRef = { token: archiveHintTypeToken };
        hint.textContent = '';
        hint.setAttribute('aria-hidden', 'false');
        hint.classList.add('is-visible');
        archiveHintActive = true;
        scramblePunctuation();
        typeLikeHuman(hint, 'dig through\nclick to open', tokenRef).then(() => {
            if (tokenRef.token !== archiveHintTypeToken) return;
            archiveHintActive = false;
            settlePunctuation();
            if (typeof window.__settleArchiveIntro === 'function') {
                window.__settleArchiveIntro();
            }
            showArchiveHint._timer = setTimeout(() => {
                hint.classList.remove('is-visible');
                hint.setAttribute('aria-hidden', 'true');
            }, 4500);
        });
    }

    function hideArchiveHint() {
        const hint = document.getElementById('archive-hint');
        if (!hint) return;
        archiveHintTypeToken += 1;
        archiveHintActive = false;
        hint.classList.remove('is-visible');
        hint.setAttribute('aria-hidden', 'true');
        hint.textContent = '';
        clearTimeout(showArchiveHint._timer);
        settlePunctuation();
        if (typeof window.__settleArchiveIntro === 'function') {
            window.__settleArchiveIntro();
        }
    }

    function showSection(sectionId) {
        const archiveSection = document.getElementById('archive');
        if (archiveSection && archiveSection.style.display === 'block' && sectionId !== 'archive') {
            saveArchiveScroll();
        }

        document.querySelectorAll('.page-section').forEach(p => p.style.display = 'none');
        
        const targetSection = document.getElementById(sectionId);
        if (targetSection) {
            targetSection.style.display = 'block';
            setMobileSectionMode(sectionId);
            
            if (sectionId === 'archive') {
                restoreArchiveScroll();
                showArchiveHint();
            } else {
                hideArchiveHint();
            }
        }

        // Always sync landing video (desktop + mobile)
        if (typeof window.__syncLandingVideo === 'function') {
            window.__syncLandingVideo(sectionId);
        }
        
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.getElementById('link-' + sectionId);
        if (activeLink) activeLink.classList.add('active');
    }

    window.addEventListener('popstate', () => {
        const hash = window.location.hash.substring(1) || 'landing';
        showSection(hash);
    });

    window.addEventListener('load', function() {
        const storedScroll = sessionStorage.getItem('archiveScrollPos');
        if (storedScroll) {
            savedArchiveScroll = parseInt(storedScroll, 10);
        }

        initArchiveBoard();

        let sectionToShow = 'landing';
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById(hash)) {
            sectionToShow = hash;
        } else if (storedScroll && storedScroll > 0) {
            sectionToShow = 'archive';
        }

        showSection(sectionToShow);
    });

    // Re-roll composition when returning from bfcache (mobile/desktop)
    window.addEventListener('pageshow', function(e) {
        if (!e.persisted) return;
        if (typeof window.__randomizeArchiveComposition === 'function') {
            window.__randomizeArchiveComposition();
        }
    });

    // Start punctuation as soon as the page is interactive (first 3s)
    startPunctuationAnimation();
</script>
