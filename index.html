<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>damaris</title>
    <!-- Kept tailwind for utility, though your custom CSS does most work -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- GLOBAL SETTINGS --- */
        html { width: 100%; height: 100%; background-color: #000; overflow-x: hidden; }
        body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #fff; overflow: hidden; overflow-x: hidden; font-family: 'Cascade Mono', monospace; font-weight: regular; font-size: 10pt; -webkit-font-smoothing: none; transition: background-color 0.5s ease; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }

        a { color: #fff; text-decoration: none; cursor: pointer; }
        a.active { 
            text-decoration: none; 
            background-color: #fff; 
            color: #000; 
        }

        @media (hover: hover) {
            a:hover { 
                text-decoration: none; 
                background-color: #fff; 
                color: #000; 
            }
        }

        @media (hover: none) {
            a.nav-link:active {
                background-color: #fff;
                color: #000;
            }
        }

        /* --- PUNCTUATION STYLING --- */
        #nav-container .nav-text span {
            font-size: 10pt !important;
            font-weight: bold !important;
            color: #fff !important;
        }

        /* --- NAVIGATION --- */
        #nav-container { position: fixed; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 100; padding: 0 20px; padding-bottom: max(0px, env(safe-area-inset-bottom)); box-sizing: border-box; user-select: none; overflow: hidden; white-space: nowrap; }
        .nav-text { display: inline-block; white-space: nowrap; }
        
        #punc-1 { width: 14ch; display: inline-block; } 
        #punc-2 { width: 13ch; display: inline-block; } 
        #punc-3 { width: 17ch; display: inline-block; } 
        #punc-4 { width: 13ch; display: inline-block; } 
        
        .link-fixed-width { display: inline-block; width: 75px; text-align: center; }
        
        .nav-link { 
            display: inline-block; 
            padding: 0 2px; 
            width: 100%; 
            text-align: center; 
            box-sizing: border-box; 
            transition: background-color 0.3s ease, color 0.3s ease; 
            font-weight: bold;
            color: #fff;
            font-size: 10pt;
        }

        /* --- SECTIONS (PAGES) --- */
        .page-section { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            overflow-x: hidden; 
            overscroll-behavior-x: none; 
            -webkit-overflow-scrolling: touch;
            background-color: #000; 
            padding: 80px 0 100px 0; 
            box-sizing: border-box; 
            z-index: 10; 
            animation: fadeIn 0.4s ease-out forwards; 
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #landing-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: 0;
        }

        #landing {
            padding: 0;
            overflow: hidden;
        }

        #landing .grid-12 {
            position: relative;
            z-index: 1;
        }

        /* --- GRID SYSTEMS --- */
        .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; max-width: none; margin: 0; align-items: start; }
        .project-content-wrapper { padding: 20px 36px 150px 36px; width: 100%; margin: 0; box-sizing: border-box; }
        
        /* --- SLIDESHOW (From Project Pages) --- */
        .slideshow-container { display: flex; overflow-x: auto; gap: 5px; width: 100%; height: 60vh; margin-bottom: 0; padding-left: 0; padding-right: 0; box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: auto; }
        .slideshow-container::-webkit-scrollbar { display: none; }
        .slide { flex: 0 0 auto; height: 100%; width: auto; position: relative; }
        .slide img, .slide video { height: 100%; width: auto; object-fit: contain; display: block; }

        /* --- ARCHIVE LAYOUT --- */
        .archive-free-layout {
            position: relative; 
            width: 100%;
            min-height: 5000px; 
            max-width: 100%; 
            margin: 0 auto;
        }

        a.project-item { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: transparent; 
            border: none; 
            cursor: grab;
            text-decoration: none; 
            color: #fff; 
            position: absolute; 
            z-index: 1;
            top: var(--top, auto);
            left: var(--left, auto);
            right: var(--right, auto);
            width: var(--width, auto);
            height: var(--height, auto); 
            justify-content: center; 
            user-select: none;
            -webkit-user-drag: none;
        }
        
        a.project-item.dragging {
            cursor: grabbing;
            z-index: 1000 !important;
            transition: none !important; 
        }
        
        a.project-item:hover { z-index: 50; text-shadow: none; background: transparent; } 

        .archive-slot-1 { --top: 0px; --right: 0px; --width: 30%; z-index: 3; text-align: right; align-items: flex-end; }
        .archive-slot-3 { --top: 700px; --left: 20px; --width: 60%; z-index: 8; }
        .archive-slot-4 { --top: 1000px; --left: -40px; --width: 70%; z-index: 5; text-align: left; align-items: flex-end; }
        .archive-slot-6 { --top: 1700px; --right: 0px; --width: 100%; z-index: 7; text-align: right; align-items: flex-end; }
        .archive-slot-9 { --top: 2300px; --right: 200px; --width: 50%; z-index: 6; }
        .archive-slot-7 { --top: 2350px; --left: 0px; --width: 100%; z-index: 2; }
        .archive-slot-2 { --top: 3100px; --left: 50px; --width: 100%; z-index: 10; }
        .archive-slot-5 { --top: 3600px; --right: 50px; --width: 100%; z-index: 4; }
        .archive-slot-10 { --top: 4450px; --left: 200px; --width: 80%; z-index: 1; }
        .archive-slot-8 { --top: 1000px; --left: 500px; --width: 40%; z-index: 9; }

        .project-img, .project-video { height: auto; display: block; border: none; pointer-events: none; }
        .project-description { line-height: 1.2; grid-column: 1 / 10; }
        .col-span-12 { grid-column: span 12; }
        
        @media (max-width: 1024px) {
            .grid-12 { grid-template-columns: repeat(4, 1fr); }
            .col-span-12 { grid-column: span 4 !important; }
            .project-description { grid-column: 1 / -1 !important; }
            .slideshow-container { height: 50vh; }
            .page-section { padding: 48px 0 110px 0; }
            #landing { padding: 0; overflow: hidden; }
            #landing-video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center center;
                transform: scale(1.75);
                transform-origin: center center;
            }
            #archive.page-section {
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            /* Native document scroll while viewing archive — more reliable on phones */
            html.mobile-archive-open,
            html.mobile-archive-open body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: auto;
                touch-action: pan-y;
            }
            html.mobile-archive-open #site-content {
                height: auto;
                min-height: 100%;
                overflow: visible;
            }
            html.mobile-archive-open #archive.page-section {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                height: auto;
                min-height: 100vh;
                overflow: visible;
                padding: 24px 0 120px;
                animation: none;
            }
            html.mobile-archive-open #landing {
                display: none !important;
            }
            html.mobile-archive-open #nav-container {
                position: fixed;
            }
            #nav-container {
                bottom: 12px;

                overflow: visible;
            }
            .nav-text {
                display: inline-flex;
                align-items: center;

                gap: 0;

            #punc-1, #punc-4 { display: none !important; }
            #punc-2, #punc-3 {

            .archive-free-layout {

                max-width: 100%;

            .archive-free-layout a.project-item {

                display: block;
                width: 100% !important;
                margin: 0;
                text-align: left !important;
                align-items: flex-start !important;

                height: auto !important;
                top: auto !important;

                right: auto !important;
                z-index: 1;

            /* sketchbook — nearly full / a bit bigger */
            .archive-free-layout a.project-item:nth-child(1) {

                width: 108% !important;
                margin-left: -4%;

            /* photography — enlarged full bleed */
            .archive-free-layout a.project-item:nth-child(2) {

                margin: 0 0 20px 0;
                z-index: 1;
                overflow: hidden;
            }
            .archive-free-layout a.project-item:nth-child(2) .project-img {
                width: 118% !important;
                margin-left: -9%;
            }

            /* designclassics — larger, centered */
            .archive-free-layout a.project-item:nth-child(3) {
                width: 88% !important;

            }
            .archive-free-layout a.project-item:nth-child(3) .project-img {
                width: 100% !important;
                margin-left: 0;
            }

            /* paris — larger, right-biased bleed, light overlap on designclassics */
            .archive-free-layout a.project-item:nth-child(4) {
                width: 100% !important;
                margin: -36% 0 28px 0;
                z-index: 4;
                overflow: hidden;
            }
            .archive-free-layout a.project-item:nth-child(4) .project-img {
                width: 162% !important;

            /* erinnerung — full bleed */

                width: 100% !important;
                margin: 0 0 48px 0;
                z-index: 1;
            }

            /* kyoto — compact */
            .archive-free-layout a.project-item:nth-child(6) {
                width: 55% !important;
                margin: 0 0 12px 18px;
                z-index: 2;
            }

            /* london — larger, shifted further right, overlaps neighbors */
            .archive-free-layout a.project-item:nth-child(7) {
                width: 100% !important;
                margin: -32% 0 -28% 0;
                z-index: 5;
                overflow: hidden;
            }
            .archive-free-layout a.project-item:nth-child(7) .project-img {

                margin-left: -8%;
            }

            /* surveillance — full bleed, sits under london overlap */

                width: 100% !important;
                margin: 36px 0 20px 0;
                z-index: 1;
            }

            /* shades — larger, centered, light overlap */
            .archive-free-layout a.project-item:nth-child(9) {
                width: 100% !important;
                margin: -14% auto 44px;
                z-index: 3;
                overflow: hidden;
            }
            .archive-free-layout a.project-item:nth-child(9) .project-img {
                width: 112% !important;
                margin-left: -6%;
            }

            /* squares — bigger, flush left to the border */
            .archive-free-layout a.project-item:nth-child(10) {
                width: 70% !important;
                margin: 8px 0 28px 0;
                z-index: 1;
            }

            .archive-free-layout a.project-item:active {
                z-index: 20;
            }
        }

        #site-content { width: 100%; height: 100%; }

        .project-img {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);

        @media (hover: hover) {

                transform: scale(1.04);
            }
        }
        
        .project-item.dragging .project-img {
            transform: scale(1.04); 
        }
    </style>
</head>

<script>
    const IS_DESKTOP = window.innerWidth >= 1025;
    const IS_MOBILE = !IS_DESKTOP;

    // Mobile-only background video (desktop keeps startvideo.mp4)
    (function applyBackgroundVideo() {
        const video = document.getElementById('landing-video') || document.getElementById('bg-video');
        if (!video) return;
        const source = video.querySelector('source');
        if (!source) return;
        if (IS_MOBILE) {
            source.src = 'video/startvideo-mobile.mp4';
            video.load();
            video.play().catch(() => {});
        }
    })();
    
    // --- PUNCTUATION ANIMATION ---
    // Mobile uses short separators so the nav never overlaps.
    const PUNCTUATION_FINAL = IS_MOBILE
        ? {
            'punc-1': '',
            'punc-2': ' / ',
            'punc-3': ' / ',
            'punc-4': ''
        }
        : {
            'punc-1': '//////////// , ',
            'punc-2': ' / /. . . , / ',
            'punc-3': ' ,,. /////.,:;:* ',
            'punc-4': '. ../-.-_.-.--'
        };
    const PUNCTUATION_POOL = ['/', ',', '.', ':', ';', '*', '-', '_', '|', '+', '(', ')', '[', ']', '<', '>', ' '];
    const activeIntervals = {};
    let isLoadAnimating = true;

    function generateRandomPunctuation(length) {
        let result = '';
        for (let i = 0; i < length; i++) {
            result += PUNCTUATION_POOL[Math.floor(Math.random() * PUNCTUATION_POOL.length)];
        }
        return result;
    }

    function animateSpecificPunctuation(puncId) {
        const element = document.getElementById(puncId);
        if (element) {
            const len = PUNCTUATION_FINAL[puncId].length || 3;
            element.textContent = generateRandomPunctuation(len);
        }
    }

    function startPunctuationAnimation() {
        const minDuration = 3000;
        const startedAt = Date.now();
        const visibleIds = IS_MOBILE
            ? ['punc-2', 'punc-3']
            : Object.keys(PUNCTUATION_FINAL);

        for (const id in PUNCTUATION_FINAL) {
            const el = document.getElementById(id);
            if (el && PUNCTUATION_FINAL[id] === '') el.textContent = '';
        }

        const loadInterval = setInterval(() => {
            visibleIds.forEach(id => animateSpecificPunctuation(id));
        }, 50);

        function finishAnimation() {
            const remaining = Math.max(0, minDuration - (Date.now() - startedAt));
            setTimeout(() => {
                clearInterval(loadInterval);
                isLoadAnimating = false;
                for (const id in PUNCTUATION_FINAL) {
                    const el = document.getElementById(id);
                    if (el) el.textContent = PUNCTUATION_FINAL[id];
                }
            }, remaining);
        }

        // Keep scrambling while the page is still loading (covers/video), at least 3s
        if (document.readyState === 'complete') {
            finishAnimation();
        } else {
            window.addEventListener('load', finishAnimation, { once: true });
        }
    }

    function startHoverAnimation(puncId1, puncId2) {
        if (isLoadAnimating || IS_MOBILE) return; 
        if (!activeIntervals[puncId1]) {
            animateSpecificPunctuation(puncId1);
            activeIntervals[puncId1] = setInterval(() => animateSpecificPunctuation(puncId1), 50);
        }
        if (!activeIntervals[puncId2]) {
            animateSpecificPunctuation(puncId2);
            activeIntervals[puncId2] = setInterval(() => animateSpecificPunctuation(puncId2), 50);
        }
    }

    function stopHoverAnimation(puncId1, puncId2) {
        if (activeIntervals[puncId1]) {
            clearInterval(activeIntervals[puncId1]);
            delete activeIntervals[puncId1];
            const el1 = document.getElementById(puncId1);
            if (el1) el1.textContent = PUNCTUATION_FINAL[puncId1];
        }
        if (activeIntervals[puncId2]) {
            clearInterval(activeIntervals[puncId2]);
            delete activeIntervals[puncId2];
            const el2 = document.getElementById(puncId2);
            if (el2) el2.textContent = PUNCTUATION_FINAL[puncId2];
        }
    }

    // --- DRAGGABLE FUNCTIONALITY ---
    function initDraggable() {
        if (!IS_DESKTOP) return; 

        const items = document.querySelectorAll('.project-item');
        let dragItem = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        items.forEach(item => {
            item.addEventListener('mousedown', dragStart);
            
            item.addEventListener('click', function(e) {
                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                } else {
                    saveArchiveScroll();
                }
            });
            
            item.addEventListener('touchstart', dragStart, {passive: false});
        });

        function dragStart(e) {
            if (IS_MOBILE) return;
            if (e.type === 'mousedown' && e.button !== 0) return;

            dragItem = this;
            const rect = dragItem.getBoundingClientRect();
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const currentLeft = dragItem.offsetLeft;
            const currentTop = dragItem.offsetTop;

            dragItem.style.left = currentLeft + 'px';
            dragItem.style.top = currentTop + 'px';
            dragItem.style.right = 'auto'; 
            dragItem.style.bottom = 'auto';
            dragItem.style.width = getComputedStyle(dragItem).width; 
            dragItem.style.height = getComputedStyle(dragItem).height;

            dragOffsetX = clientX - rect.left;
            dragOffsetY = clientY - rect.top;
            
            startX = clientX;
            startY = clientY;
            isDragging = false; 

            dragItem.classList.add('dragging');

            if (e.type === 'mousedown') {
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
            } else {
                document.addEventListener('touchmove', dragMove, {passive: false});
                document.addEventListener('touchend', dragEnd);
            }
        }

        function dragMove(e) {
            if (!dragItem) return;

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const dist = Math.hypot(clientX - startX, clientY - startY);
            if (dist > 5) {
                isDragging = true;
            }

            if (e.type === 'touchmove') e.preventDefault(); 

            const parentRect = dragItem.parentElement.getBoundingClientRect();
            
            const newLeft = clientX - parentRect.left - dragOffsetX;
            const newTop = clientY - parentRect.top - dragOffsetY;

            dragItem.style.left = newLeft + 'px';
            dragItem.style.top = newTop + 'px';
        }

        function dragEnd(e) {
            if (dragItem) {
                dragItem.classList.remove('dragging');
                dragItem = null;
            }
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', dragEnd);
            
            setTimeout(() => { isDragging = false; }, 50);
        }
    }

    // Mobile: tap vs scroll on covers (document scroll handles the actual scrolling)
    function initMobileArchiveScroll() {
        if (!IS_MOBILE) return;

        const items = document.querySelectorAll('.archive-free-layout a.project-item');
        const TAP_MOVE_LIMIT = 10;

        items.forEach(item => {
            let startX = 0;
            let startY = 0;
            let moved = false;

            item.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                moved = false;
            }, { passive: true });

            item.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (Math.abs(t.clientY - startY) > TAP_MOVE_LIMIT || Math.abs(t.clientX - startX) > TAP_MOVE_LIMIT) {
                    moved = true;
                }
            }, { passive: true });

            item.addEventListener('click', (e) => {
                if (moved) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
                saveArchiveScroll();
            });
        });

        window.addEventListener('scroll', () => {
            if (!document.documentElement.classList.contains('mobile-archive-open')) return;
            savedArchiveScroll = window.scrollY || document.documentElement.scrollTop || 0;
            sessionStorage.setItem('archiveScrollPos', savedArchiveScroll);
        }, { passive: true });
    }

    // --- SCROLL PRESERVATION LOGIC ---
    let savedArchiveScroll = 0;

    function saveArchiveScroll() {
        if (IS_MOBILE) {
            savedArchiveScroll = window.scrollY || document.documentElement.scrollTop || 0;
            sessionStorage.setItem('archiveScrollPos', savedArchiveScroll);
            return;
        }
        const archiveEl = document.getElementById('archive');
        if (archiveEl) {
            savedArchiveScroll = archiveEl.scrollTop;
            sessionStorage.setItem('archiveScrollPos', savedArchiveScroll);
        }
    }

    function restoreArchiveScroll() {
        let pos = savedArchiveScroll;
        if (pos === 0) {
            const stored = sessionStorage.getItem('archiveScrollPos');
            if (stored) pos = parseInt(stored, 10);
        }
        requestAnimationFrame(() => {
            if (IS_MOBILE) {
                window.scrollTo(0, pos);
            } else {
                const archiveEl = document.getElementById('archive');
                if (archiveEl) archiveEl.scrollTop = pos;
            }
        });
    }

    // --- NAVIGATION LOGIC ---
    function handleNavClick(e, sectionId) {
        if (e) e.preventDefault();
        history.pushState(null, null, '#' + sectionId);
        showSection(sectionId);
    }

    // FIX: PROFILE SINGLE CLICK
    function handleProfileNavigation(e) {
        e.preventDefault();
        saveArchiveScroll();
        window.location.href = "profile.html";
    }

    function setMobileSectionMode(sectionId) {
        if (!IS_MOBILE) return;
        const root = document.documentElement;
        root.classList.toggle('mobile-archive-open', sectionId === 'archive');
        if (sectionId !== 'archive') {
            window.scrollTo(0, 0);
        }
    }

    function showSection(sectionId) {
        const archiveSection = document.getElementById('archive');
        if (archiveSection && archiveSection.style.display === 'block' && sectionId !== 'archive') {
            saveArchiveScroll();
        }

        document.querySelectorAll('.page-section').forEach(p => p.style.display = 'none');
        
        const targetSection = document.getElementById(sectionId);
        if (targetSection) {
            targetSection.style.display = 'block';
            setMobileSectionMode(sectionId);
            
            if (sectionId === 'archive') {
                restoreArchiveScroll();
            }
        }
        
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.getElementById('link-' + sectionId);
        if (activeLink) activeLink.classList.add('active');
    }

    window.addEventListener('popstate', () => {
        const hash = window.location.hash.substring(1) || 'landing';
        showSection(hash);
    });

    window.addEventListener('load', function() {
        const storedScroll = sessionStorage.getItem('archiveScrollPos');
        if (storedScroll) {
            savedArchiveScroll = parseInt(storedScroll, 10);
        }

        if (IS_DESKTOP) initDraggable();
        else initMobileArchiveScroll();

        let sectionToShow = 'landing';
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById(hash)) {
            sectionToShow = hash;
        } else if (storedScroll && storedScroll > 0) {
            sectionToShow = 'archive';
        }

        showSection(sectionToShow);
    });

    // Start punctuation as soon as the page is interactive (first 3s)
    startPunctuationAnimation();
</script>
